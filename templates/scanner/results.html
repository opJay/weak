<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Weak - 스캔 결과">
    <title>스캔 결과 - Weak</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/scanner.css">
    <link rel="stylesheet" href="/static/css/wizard.css">
</head>
<body data-scan-id="{{ scan_id }}">
    <!-- Header -->
    <header class="header">
        <div class="container header-container">
            <div class="header-left">
                <h1 class="logo">
                    <a href="/" style="color: inherit; text-decoration: none;">Weak</a>
                </h1>
                <p class="tagline">웹 취약점 스캐너</p>
            </div>
            <div class="header-right">
                <div class="header-notice">
                    ⚠️ 이 도구는 <strong>교육 및 연구 목적</strong>으로만 사용되어야 합니다.
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <!-- Loading State (진행 중일 때 표시) -->
        <div id="loadingSection" style="display: none;">
            <div class="step2-container">
                <div class="step2-title">스캔 진행 중...</div>

                <div class="step2-progress-container">
                    <div class="step2-progress-bar">
                        <div class="step2-progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <div class="step2-progress-text" id="progressText">0%</div>
                </div>

                <div class="step2-current-step" id="currentStepDisplay">
                    <div class="step2-step-icon" id="stepIcon">🔍</div>
                    <div class="step2-step-title" id="stepTitle">초기화</div>
                    <div class="step2-step-desc" id="stepDesc">스캔 준비 중...</div>
                </div>
            </div>
        </div>

        <!-- Results State (완료되었을 때 표시) -->
        <div id="resultsSection" style="display: none;">
            <!-- Split Layout Container -->
            <div class="results-container">
                <!-- 좌측 패널 -->
                <div class="results-left-panel">
                    <!-- Scan Info Bar (좌측 최상단) -->
                    <div class="scan-info-bar">
                        <div class="scan-info-content">
                            <span class="scan-url" id="scanUrl">-</span>
                            <span class="scan-time" id="scanTime">-</span>
                        </div>
                        <div class="scan-actions">
                            <a href="/" class="scan-action-btn primary">새 스캔</a>
                            <button class="scan-action-btn secondary" id="shareBtn">공유</button>
                        </div>
                    </div>

                    <!-- 종합 점수 카드 -->
                    <div class="summary-section">
                        <div class="summary-cards">
                            <div class="summary-card">
                                <div class="summary-icon">🔒</div>
                                <div class="summary-info">
                                    <div class="summary-title">보안</div>
                                    <div class="summary-value" id="securityScore">-</div>
                                </div>
                            </div>
                            <div class="summary-card">
                                <div class="summary-icon">📊</div>
                                <div class="summary-info">
                                    <div class="summary-title">웹 표준</div>
                                    <div class="summary-value" id="standardsScore">-</div>
                                </div>
                            </div>
                            <div class="summary-card">
                                <div class="summary-icon">♿</div>
                                <div class="summary-info">
                                    <div class="summary-title">접근성</div>
                                    <div class="summary-value" id="accessibilityScore">-</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 검사 항목 리스트 (좌측 하단) -->
                    <div class="test-list-section">
                        <!-- Security Tests -->
                        <div class="test-category" id="securityCategory">
                            <h3 class="category-title">🔒 보안 검사</h3>
                            <div class="test-items" id="securityTestList">
                                <!-- Security test items will be added here dynamically -->
                            </div>
                        </div>

                        <!-- Standards Tests -->
                        <div class="test-category" id="standardsCategory">
                            <h3 class="category-title">📊 웹 표준 검사</h3>
                            <div class="test-items" id="standardsTestList">
                                <!-- Standards test items will be added here dynamically -->
                            </div>
                        </div>

                        <!-- Accessibility Tests -->
                        <div class="test-category" id="accessibilityCategory">
                            <h3 class="category-title">♿ 접근성 검사</h3>
                            <div class="test-items" id="accessibilityTestList">
                                <!-- Accessibility test items will be added here dynamically -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 우측 패널 -->
                <div class="results-right-panel">
                    <div class="detail-display" id="detailDisplay">
                        <div class="no-selection">
                            <span class="no-selection-icon">👈</span>
                            <p class="no-selection-text">좌측에서 검사 항목을 선택해주세요</p>
                            <p class="no-selection-hint">선택한 항목의 상세 정보가 여기에 표시됩니다</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error State -->
        <div id="errorSection" style="display: none;">
            <div class="error-container">
                <div class="error-icon">⚠️</div>
                <h2 class="error-title">오류가 발생했습니다</h2>
                <p class="error-message" id="errorMessage">스캔 중 문제가 발생했습니다.</p>
                <div class="error-actions">
                    <a href="/" class="step3-btn step3-btn-primary">홈으로 돌아가기</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Weak Scanner | <a href="https://github.com/opJay/weak" target="_blank">GitHub</a> | MIT License</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="/static/js/results.js"></script>
</body>
</html>
