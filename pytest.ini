[pytest]
# pytest 설정 파일

# 테스트 파일 패턴
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# 테스트 디렉토리
testpaths = tests

# 출력 옵션
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# 마커 정의
markers =
    unit: 단위 테스트
    integration: 통합 테스트
    slow: 느린 테스트
    network: 네트워크 필요
    security: 보안 스캐너 테스트
    regression: 회귀 테스트

# 커버리지 설정
[coverage:run]
source = scanner
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: